name: build

on:
  push:
  pull_request:

jobs:
  stub-build:
    # Type-checks the mod against stubs/ plus the real Jotunn, HarmonyX and
    # Unity assemblies from NuGet. CI has no Valheim install, so this cannot
    # produce a DLL that loads in the game.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/TarkoValheim/TarkoValheim.csproj -p:UseStubs=true -warnaserror
